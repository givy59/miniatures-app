<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Collection de Miniatures</title>

  <!-- Lien vers votre fichier PNG personnalisé -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">

  <!-- Manifest mis à jour -->
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .config-panel {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button {
      background: var(--accent);
      color: white;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-delete {
      background: #ef4444;
    }

    .sync-status {
      font-size: 0.85rem;
      margin-top: 8px;
      color: var(--text-muted);
    }
    .sync-status.online { color: #10b981; }
    .sync-status.syncing { color: #f59e0b; }
    .sync-status.error { color: #ef4444; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .tab-btn.active {
      background: var(--accent);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .car-card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .car-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .car-marque-globale {
      font-weight: bold;
      color: var(--accent);
      margin: 8px 0 4px 0;
    }

    .car-details {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .car-actions {
      display: flex;
      gap: 8px;
    }

    .car-actions button {
      flex: 1;
    }

    .collection-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .collection-table th, .collection-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .table-img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
    }

    .stats-bar {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .progress-bar {
      display: flex;
      height: 12px;
      background: #090d16;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-segment {
      height: 100%;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lightbox-img {
      max-height: 300px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .db-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding: 8px;
      background: #090d16;
      border-radius: 4px;
    }
  </style>
  <script>
    // ============= GESTION IndexedDB =============
    const DB_NAME = 'MiniaturesCars';
    const STORE_NAME = 'cars';
    let db = null;
    let collection = [];

    async function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          console.log('IndexedDB initialisée');
          loadAllCars().then(resolve).catch(reject);
        };
        
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
            console.log('Object Store créé');
          }
        };
      });
    }

    async function loadAllCars() {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        
        request.onsuccess = () => {
          collection = request.result || [];
          resolve();
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function saveCar(car) {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.put(car);
        
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function deleteCar(id) {
      if (!db) return;
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);
        
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function migrateFromLocalStorage() {
      try {
        const stored = localStorage.getItem('carCollection');
        if (stored && collection.length === 0) {
          const oldCollection = JSON.parse(stored);
          console.log('Migration depuis localStorage:', oldCollection.length, 'voitures');
          
          for (const car of oldCollection) {
            await saveCar(car);
          }
          await loadAllCars();
          localStorage.removeItem('carCollection');
          console.log('Migration terminée');
        }
      } catch (e) {
        console.error('Erreur migration:', e);
      }
    }

    // ============= DONNÉES GLOBALES =============
    var selectedBrand = 'Toutes';
    var currentView = 'cards';
    var currentImageBase64 = '';

    var AUTHORIZED_BRANDS = ['Toutes', 'Hot Wheels', 'Matchbox', 'Majorette', 'Autre'];
    var BRAND_COLORS = {
      'Hot Wheels': '#ef4444',
      'Matchbox': '#f59e0b',
      'Majorette': '#10b981',
      'Autre': '#8b5cf6'
    };

    // ============= CONFIGURATION GITHUB =============
    function getGhConfig() {
      return {
        user: (localStorage.getItem('gh_user') || '').trim(),
        repo: (localStorage.getItem('gh_repo') || '').trim(),
        token: (localStorage.getItem('gh_token') || '').trim(),
        filePath: 'data.json'
      };
    }

    function saveGhConfig() {
      var userVal = document.getElementById('gh-user').value.trim();
      var repoVal = document.getElementById('gh-repo').value.trim();
      var tokenVal = document.getElementById('gh-token').value.trim();

      localStorage.setItem('gh_user', userVal);
      localStorage.setItem('gh_repo', repoVal);
      localStorage.setItem('gh_token', tokenVal);

      alert('Configuration GitHub enregistrée !');
      loadFromGitHub();
    }

    function updateSyncStatus(text, statusClass) {
      var el = document.getElementById('sync-status');
      if (!el) return;
      el.textContent = text;
      el.className = 'sync-status ' + (statusClass || '');
    }

    // ============= SYNCHRONISATION GITHUB =============
    async function loadFromGitHub() {
      var cfg = getGhConfig();
      if (!cfg.user || !cfg.repo) return;

      updateSyncStatus('⌛ Chargement GitHub...', 'syncing');
      
      var apiUrl = 'https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/' + cfg.filePath + '?ref=main&t=' + Date.now();

      try {
        var headers = {};
        if (cfg.token) {
          headers['Authorization'] = 'token ' + cfg.token;
        }

        var res = await fetch(apiUrl, { headers: headers });
        if (res.ok) {
          var fileData = await res.json();
          
          if (!fileData.content) {
            updateSyncStatus('⚠️ Fichier data.json vide', 'error');
            return;
          }

          var base64Cleaner = fileData.content.replace(/\s/g, '');
          var binaryString = atob(base64Cleaner);
          var bytes = new Uint8Array(binaryString.length);
          for (var i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          var jsonText = new TextDecoder('utf-8').decode(bytes);

          if (!jsonText || !jsonText.trim()) {
            collection = [];
          } else {
            const remoteData = JSON.parse(jsonText);
            // Fusionner avec les données locales (les données locales prioritaires)
            for (const car of remoteData) {
              const existing = collection.find(c => c.id === car.id);
              if (!existing) {
                await saveCar(car);
              }
            }
          }

          await loadAllCars();
          filterAndRender();
          updateStats();
          updateSyncStatus('☁️ Synchronisé avec GitHub', 'online');
        } else {
          updateSyncStatus('⚠️ Erreur chargement GitHub', 'error');
        }
      } catch (err) {
        console.error('Erreur lecture GitHub:', err);
        updateSyncStatus('📱 Mode hors-ligne (Local)');
      }
    }

    async function pushToGitHub() {
      var cfg = getGhConfig();
      if (!cfg.user || !cfg.repo || !cfg.token) {
        updateSyncStatus('⚠️ GitHub non configuré', 'error');
        return;
      }

      updateSyncStatus('⌛ Sauvegarde sur GitHub...', 'syncing');

      var apiUrl = 'https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/' + cfg.filePath;
      
      var jsonString = JSON.stringify(collection, null, 2);
      var bytes = new TextEncoder().encode(jsonString);
      var binString = Array.from(bytes, function(byte) { return String.fromCharCode(byte); }).join('');
      var contentBase64 = btoa(binString);

      try {
        var getRes = await fetch(apiUrl, {
          headers: { 'Authorization': 'token ' + cfg.token }
        });
        
        var sha = '';
        if (getRes.ok) {
          var fileInfo = await getRes.json();
          sha = fileInfo.sha;
        }

        var putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + cfg.token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Mise à jour automatique de la collection (v2 - IndexedDB)',
            content: contentBase64,
            sha: sha || undefined
          })
        });

        if (putRes.ok) {
          updateSyncStatus('☁️ Sauvegardé sur GitHub !', 'online');
        } else {
          updateSyncStatus('❌ Erreur de sauvegarde GitHub', 'error');
        }
      } catch (err) {
        console.error('Erreur GitHub:', err);
        updateSyncStatus('❌ Erreur réseau GitHub', 'error');
      }
    }

    // ============= INTERFACE =============
    function setView(view) {
      currentView = view;
      var btnCard = document.getElementById('view-card-btn');
      var btnList = document.getElementById('view-list-btn');
      if (btnCard) btnCard.classList.toggle('active', view === 'cards');
      if (btnList) btnList.classList.toggle('active', view === 'list');
      filterAndRender();
    }

    function renderBrandTabs() {
      var container = document.getElementById('brand-tabs');
      if (!container) return;
      container.innerHTML = '';
      AUTHORIZED_BRANDS.forEach(function(brand) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn ' + (brand === selectedBrand ? 'active' : '');
        btn.textContent = brand;
        btn.onclick = function() {
          selectedBrand = brand;
          renderBrandTabs();
          filterAndRender();
        };
        container.appendChild(btn);
      });
    }

    function filterAndRender() {
      var searchInput = document.getElementById('search-input');
      var searchTerm = (searchInput ? searchInput.value.toLowerCase() : '').trim();

      var filtered = collection.filter(function(car) {
        var matchBrand = selectedBrand === 'Toutes' || car.fabricant === selectedBrand;
        var matchSearch = !searchTerm || 
          (car.marque && car.marque.toLowerCase().includes(searchTerm)) ||
          (car.modele && car.modele.toLowerCase().includes(searchTerm)) ||
          (car.ref && car.ref.toLowerCase().includes(searchTerm));
        return matchBrand && matchSearch;
      });

      renderCollection(filtered);
    }

    function renderCollection(data) {
      var container = document.getElementById('collection-container');
      if (!container) return;
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; padding: 40px 0;">Aucune voiture trouvée.</p>';
        return;
      }

      if (currentView === 'cards') {
        var grid = document.createElement('div');
        grid.className = 'collection-grid';
        
        data.forEach(function(car) {
          var card = document.createElement('div');
          card.className = 'car-card';
          card.innerHTML = 
            '<div>' +
              '<div class="car-image" onclick="openLightbox(' + car.id + ')">' +
                (car.image ? '<img src="' + car.image + '">' : '<span style="font-size:2rem;">🏎️</span>') +
              '</div>' +
              '<div class="car-marque-globale">' + (car.fabricant || 'Inconnu') + '</div>' +
              '<div class="car-details">' +
                '<div><strong>Marque :</strong> ' + (car.marque || '-') + '</div>' +
                '<div><strong>Modèle :</strong> ' + (car.modele || '-') + '</div>' +
                '<div><strong>Série :</strong> ' + (car.serie || '-') + '</div>' +
                '<div><strong>Année :</strong> ' + (car.annee || '-') + '</div>' +
                '<div><strong>Réf :</strong> ' + (car.ref || '-') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="car-actions">' +
              '<button type="button" onclick="editCar(' + car.id + ')">Éditer</button>' +
              '<button type="button" class="btn-delete" onclick="deleteCar(' + car.id + ')">Supprimer</button>' +
            '</div>';
          grid.appendChild(card);
        });
        container.appendChild(grid);
      } else {
        var table = document.createElement('table');
        table.className = 'collection-table';
        table.innerHTML = '<thead><tr><th>Photo</th><th>Fabricant</th><th>Marque</th><th>Modèle</th><th>Réf</th><th>État</th><th>Actions</th></tr></thead><tbody></tbody>';
        var tbody = table.querySelector('tbody');

        data.forEach(function(car) {
          var row = document.createElement('tr');
          row.innerHTML = 
            '<td>' + (car.image ? '<img class="table-img" src="' + car.image + '" onclick="openLightbox(' + car.id + ')">' : '🏎️') + '</td>' +
            '<td>' + (car.fabricant || '-') + '</td>' +
            '<td>' + (car.marque || '-') + '</td>' +
            '<td>' + (car.modele || '-') + '</td>' +
            '<td>' + (car.ref || '-') + '</td>' +
            '<td>' + (car.etat || '-') + '</td>' +
            '<td><button type="button" onclick="editCar(' + car.id + ')" style="padding:4px 8px; font-size:0.8rem;">Éditer</button> <button type="button" class="btn-delete" onclick="deleteCar(' + car.id + ')" style="padding:4px 8px; font-size:0.8rem;">Sup</button></td>';
          tbody.appendChild(row);
        });
        container.appendChild(table);
      }
    }

    function updateStats() {
      var total = collection.length;
      var marques = [...new Set(collection.map(c => c.fabricant))].filter(Boolean).length;
      
      var statTotal = document.getElementById('stat-total');
      var statMarques = document.getElementById('stat-marques');
      if (statTotal) statTotal.textContent = total;
      if (statMarques) statMarques.textContent = marques;

      var distBar = document.getElementById('dist-bar');
      var distLegend = document.getElementById('dist-legend');
      if (!distBar || !distLegend) return;

      distBar.innerHTML = '';
      distLegend.innerHTML = '';

      var byBrand = {};
      AUTHORIZED_BRANDS.slice(1).forEach(b => byBrand[b] = 0);
      collection.forEach(c => {
        if (byBrand.hasOwnProperty(c.fabricant)) byBrand[c.fabricant]++;
      });

      var totalCount = Object.values(byBrand).reduce((a, b) => a + b, 0);
      if (totalCount === 0) return;

      Object.keys(byBrand).forEach(function(brand) {
        var count = byBrand[brand];
        var pct = (count / totalCount * 100).toFixed(1);
        
        var segment = document.createElement('div');
        segment.className = 'progress-segment';
        segment.style.width = pct + '%';
        segment.style.backgroundColor = BRAND_COLORS[brand] || '#808080';
        distBar.appendChild(segment);

        var legend = document.createElement('div');
        legend.className = 'legend-item';
        legend.innerHTML = 
          '<div class="legend-color" style="background-color:' + (BRAND_COLORS[brand] || '#808080') + '"></div>' +
          '<span>' + brand + ': ' + count + ' (' + pct + '%)</span>';
        distLegend.appendChild(legend);
      });
    }

    function openLightbox(id) {
      var car = collection.find(c => c.id === id);
      if (!car) return;

      var body = document.getElementById('lightbox-body');
      body.innerHTML = car.image ? '<img class="lightbox-img" src="' + car.image + '">' : '<p>Pas d\'image</p>';
      document.getElementById('lightbox-modal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    function openAddModal() {
      currentImageBase64 = '';
      document.getElementById('car-form').reset();
      document.getElementById('car-id').value = '';
      document.getElementById('car-fabricant').value = 'Hot Wheels';
      document.getElementById('car-etat').value = 'Neuf en boîte';
      document.getElementById('image-preview-container').style.display = 'none';
      document.getElementById('modal-title').textContent = 'Ajouter une voiture';
      document.getElementById('duplicate-warning').style.display = 'none';
      document.getElementById('car-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('car-modal').classList.remove('active');
      currentImageBase64 = '';
    }

    function editCar(id) {
      var car = collection.find(c => c.id === id);
      if (!car) return;

      document.getElementById('car-id').value = car.id;
      document.getElementById('car-fabricant').value = car.fabricant || 'Hot Wheels';
      document.getElementById('car-marque').value = car.marque || '';
      document.getElementById('car-modele').value = car.modele || '';
      document.getElementById('car-serie').value = car.serie || '';
      document.getElementById('car-annee').value = car.annee || '';
      document.getElementById('car-couleur').value = car.couleur || '';
      document.getElementById('car-ref').value = car.ref || '';
      document.getElementById('car-etat').value = car.etat || 'Neuf en boîte';

      currentImageBase64 = car.image || '';
      var imagePreview = document.getElementById('image-preview');
      var imagePreviewContainer = document.getElementById('image-preview-container');

      if (currentImageBase64) {
        imagePreview.src = currentImageBase64;
        imagePreviewContainer.style.display = 'block';
      } else {
        imagePreviewContainer.style.display = 'none';
      }

      document.getElementById('modal-title').textContent = 'Modifier la voiture';
      checkDuplicates();
      document.getElementById('car-modal').classList.add('active');
    }

    async function deleteCarWithConfirm(id) {
      if (confirm('Supprimer cette voiture ?')) {
        collection = collection.filter(function(c) { return c.id !== id; });
        await deleteCar(id);
        filterAndRender();
        updateStats();
        pushToGitHub();
      }
    }

    function checkDuplicates() {
      var id = document.getElementById('car-id').value;
      var marque = document.getElementById('car-marque').value.trim().toLowerCase();
      var modele = document.getElementById('car-modele').value.trim().toLowerCase();
      var ref = document.getElementById('car-ref').value.trim().toLowerCase();

      var warning = document.getElementById('duplicate-warning');

      if (!marque && !modele && !ref) {
        warning.style.display = 'none';
        return;
      }

      var isDuplicate = collection.some(function(car) {
        if (id && car.id === parseInt(id)) return false;

        var sameRef = ref && car.ref && car.ref.toLowerCase() === ref;
        var sameModel = marque && modele && car.marque && car.modele && car.marque.toLowerCase() === marque && car.modele.toLowerCase() === modele;

        return sameRef || sameModel;
      });

      warning.style.display = isDuplicate ? 'block' : 'none';
    }

    function handleImageUpload(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        currentImageBase64 = evt.target.result;
        document.getElementById('image-preview').src = currentImageBase64;
        document.getElementById('image-preview-container').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function saveCarData(e) {
      e.preventDefault();
      var id = document.getElementById('car-id').value;
      var newCar = {
        id: id ? parseInt(id) : Date.now(),
        fabricant: document.getElementById('car-fabricant').value,
        marque: document.getElementById('car-marque').value.trim(),
        modele: document.getElementById('car-modele').value.trim(),
        serie: document.getElementById('car-serie').value.trim(),
        annee: document.getElementById('car-annee').value,
        couleur: document.getElementById('car-couleur').value.trim(),
        ref: document.getElementById('car-ref').value.trim(),
        etat: document.getElementById('car-etat').value,
        image: currentImageBase64
      };

      if (id) {
        var idx = collection.findIndex(function(c) { return c.id === parseInt(id); });
        if (idx !== -1) collection[idx] = newCar;
      } else {
        collection.push(newCar);
      }

      await saveCar(newCar);
      filterAndRender();
      updateStats();
      closeModal();
      pushToGitHub();
    }

    function exportJSONFile() {
      var blob = new Blob([JSON.stringify(collection, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'collection_miniatures_sauvegarde.json';
      a.click();
    }

    function importJSONFile(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          for (const car of imported) {
            await saveCar(car);
          }
          await loadAllCars();
          filterAndRender();
          updateStats();
          pushToGitHub();
          alert('Import réussi !');
        } catch (err) {
          alert('Fichier JSON invalide.');
        }
      };
      reader.readAsText(file);
    }

    document.addEventListener('DOMContentLoaded', async function() {
      try {
        // Initialiser IndexedDB
        await initIndexedDB();
        console.log('IndexedDB chargé avec', collection.length, 'voitures');
        
        // Migrer depuis localStorage si nécessaire
        await migrateFromLocalStorage();
        
        var cfg = getGhConfig();
        if (document.getElementById('gh-user')) document.getElementById('gh-user').value = cfg.user;
        if (document.getElementById('gh-repo')) document.getElementById('gh-repo').value = cfg.repo;
        if (document.getElementById('gh-token')) document.getElementById('gh-token').value = cfg.token;

        renderBrandTabs();
        filterAndRender();
        updateStats();
        
        loadFromGitHub();

        // Nettoyage automatique du Service Worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
        }

        // Afficher info de stockage
        updateStorageInfo();
      } catch (err) {
        console.error('Erreur initialisation:', err);
        alert('Erreur lors de l\'initialisation: ' + err.message);
      }
    });

    function updateStorageInfo() {
      var info = document.getElementById('db-info');
      if (!info) return;
      info.textContent = '📊 IndexedDB actif | ' + collection.length + ' voiture(s) stockée(s)';
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏎️ Ma Collection de Miniatures</h1>
      <button onclick="openAddModal()">+ Ajouter une voiture</button>
    </header>

    <!-- Configuration GitHub -->
    <div class="config-panel">
      <strong>⚙️ Synchronisation GitHub</strong>
      <div class="config-grid">
        <input type="text" id="gh-user" placeholder="Nom d'utilisateur GitHub">
        <input type="text" id="gh-repo" placeholder="Nom du dépôt (ex: miniatures)">
        <input type="password" id="gh-token" placeholder="Token d'accès (PAT)">
        <button onclick="saveGhConfig()">Enregistrer</button>
      </div>
      <div id="sync-status" class="sync-status">Initialisation...</div>
      <div id="db-info" class="db-info">Chargement IndexedDB...</div>
    </div>

    <!-- Statistiques -->
    <div class="stats-bar">
      <div>
        Total : <strong id="stat-total">0</strong> voitures |
        Marques : <strong id="stat-marques">0</strong>
      </div>
      <div class="progress-bar" id="dist-bar"></div>
      <div class="legend" id="dist-legend"></div>
    </div>

    <!-- Onglets Marques -->
    <div class="tabs" id="brand-tabs"></div>

    <!-- Contrôles -->
    <div class="controls">
      <input type="text" id="search-input" placeholder="Rechercher..." oninput="filterAndRender()" style="width:250px;">
      <div>
        <button id="view-card-btn" class="active" onclick="setView('cards')">🎴 Cartes</button>
        <button id="view-list-btn" onclick="setView('list')">📋 Liste</button>
        <button onclick="exportJSONFile()">💾 Exporter</button>
        <button onclick="document.getElementById('import-file').click()">📂 Importer</button>
        <input type="file" id="import-file" style="display:none" onchange="importJSONFile(event)">
      </div>
    </div>

    <!-- Container de collection -->
    <div id="collection-container"></div>
  </div>

  <!-- Modal Ajout / Édition -->
  <div class="modal" id="car-modal">
    <div class="modal-content">
      <h2 id="modal-title">Ajouter une voiture</h2>
      <form id="car-form" onsubmit="saveCarData(event)">
        <input type="hidden" id="car-id">
        <div class="form-group">
          <label>Fabricant :</label>
          <select id="car-fabricant">
            <option value="Hot Wheels">Hot Wheels</option>
            <option value="Matchbox">Matchbox</option>
            <option value="Majorette">Majorette</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Marque :</label>
          <input type="text" id="car-marque" required oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>Modèle :</label>
          <input type="text" id="car-modele" required oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>Série :</label>
          <input type="text" id="car-serie">
        </div>
        <div class="form-group">
          <label>Année :</label>
          <input type="number" id="car-annee">
        </div>
        <div class="form-group">
          <label>Couleur :</label>
          <input type="text" id="car-couleur">
        </div>
        <div class="form-group">
          <label>Référence :</label>
          <input type="text" id="car-ref" oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>État :</label>
          <select id="car-etat">
            <option value="Neuf en boîte">Neuf en boîte</option>
            <option value="Loose (Très bon)">Loose (Très bon)</option>
            <option value="Loose (Joué)">Loose (Joué)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Photo :</label>
          <input type="file" accept="image/*" onchange="handleImageUpload(event)">
          <div id="image-preview-container" style="display:none; margin-top:8px;">
            <img id="image-preview" style="max-width:100%; height:120px; object-fit:contain;">
          </div>
        </div>

        <div id="duplicate-warning" style="display:none; color:#f59e0b; margin-bottom:10px; font-size:0.85rem;">
          ⚠️ Doublon potentiel détecté dans la collection !
        </div>

        <div style="display:flex; gap:8px; margin-top:16px;">
          <button type="submit" style="flex:1;">Enregistrer</button>
          <button type="button" class="btn-delete" onclick="closeModal()" style="flex:1;">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Lightbox (Agrandissement) -->
  <div class="modal" id="lightbox-modal">
    <div class="modal-content" style="text-align:center;">
      <div id="lightbox-body"></div>
      <button onclick="closeLightbox()" style="margin-top:12px; width:100%;">Fermer</button>
    </div>
  </div>
</body>
</html>
