<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Collection de Miniatures</title>

  <!-- Lien vers votre fichier PNG personnalisé -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">

  <!-- Manifest mis à jour -->
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .config-panel {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button {
      background: var(--accent);
      color: white;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-delete {
      background: #ef4444;
    }

    .sync-status {
      font-size: 0.85rem;
      margin-top: 8px;
      color: var(--text-muted);
    }
    .sync-status.online { color: #10b981; }
    .sync-status.syncing { color: #f59e0b; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .tab-btn.active {
      background: var(--accent);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .car-card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .car-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .car-marque-globale {
      font-weight: bold;
      color: var(--accent);
      margin: 8px 0 4px 0;
    }

    .car-details {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .car-actions {
      display: flex;
      gap: 8px;
    }

    .car-actions button {
      flex: 1;
    }

    .collection-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .collection-table th, .collection-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .table-img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
    }

    .stats-bar {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .progress-bar {
      display: flex;
      height: 12px;
      background: #090d16;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-segment {
      height: 100%;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 70vh;
    }

    @media (max-width: 768px) {
      .collection-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
  <script>
    // ==================== IndexedDB Setup ====================
    let db;
    const DB_NAME = 'MiniatureCollectionDB';
    const STORE_NAME = 'cars';
    const DB_VERSION = 1;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
      });
    }

    function getAllCars() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
      });
    }

    function saveCarsToIndexedDB(cars) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        
        // Effacer tout d'abord
        store.clear();
        
        // Ajouter tous les voitures
        cars.forEach(car => {
          store.put(car);
        });
        
        transaction.onerror = () => reject(transaction.error);
        transaction.oncomplete = () => resolve();
      });
    }

    async function migrateFromLocalStorage() {
      try {
        const stored = localStorage.getItem('carCollection');
        if (stored) {
          const cars = JSON.parse(stored);
          await saveCarsToIndexedDB(cars);
          console.log('✅ Migration depuis localStorage réussie');
          localStorage.removeItem('carCollection'); // Nettoyage
        }
      } catch (err) {
        console.error('Erreur migration:', err);
      }
    }

    // ==================== Variables globales ====================
    let collection = [];
    let currentView = 'cards';
    let currentImageBase64 = '';
    let currentBrandFilter = '';

    // ==================== GitHub Config ====================
    function getGhConfig() {
      return {
        user: localStorage.getItem('gh-user') || '',
        repo: localStorage.getItem('gh-repo') || '',
        token: localStorage.getItem('gh-token') || ''
      };
    }

    function saveGhConfig() {
      localStorage.setItem('gh-user', document.getElementById('gh-user').value);
      localStorage.setItem('gh-repo', document.getElementById('gh-repo').value);
      localStorage.setItem('gh-token', document.getElementById('gh-token').value);
      alert('Configuration GitHub enregistrée');
    }

    async function pushToGitHub() {
      const cfg = getGhConfig();
      if (!cfg.user || !cfg.repo || !cfg.token) return;

      updateSyncStatus('syncing');
      try {
        const dataJson = JSON.stringify(collection, null, 2);
        const response = await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${cfg.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Mise à jour collection',
            content: btoa(dataJson)
          })
        });

        if (response.ok) {
          updateSyncStatus('online');
          console.log('✅ Push GitHub réussi');
        } else {
          updateSyncStatus('error');
        }
      } catch (err) {
        console.error('Erreur GitHub:', err);
        updateSyncStatus('error');
      }
    }

    async function loadFromGitHub() {
      const cfg = getGhConfig();
      if (!cfg.user || !cfg.repo || !cfg.token) {
        updateSyncStatus('offline');
        return false;
      }

      try {
        const response = await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/data.json`, {
          headers: {
            'Authorization': `token ${cfg.token}`,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          const data = await response.json();
          const content = atob(data.content);
          const cars = JSON.parse(content);
          
          // ✅ Sécurité : ne pas accepter un fichier vide/invalide
          if (!Array.isArray(cars) || cars.length === 0) {
            console.warn('⚠️ Fichier data.json vide ou invalide sur GitHub, garde les données locales');
            updateSyncStatus('online');
            return true;
          }
          
          collection = cars;
          await saveCarsToIndexedDB(collection);
          filterAndRender();
          updateStats();
          renderBrandTabs();
          updateSyncStatus('online');
          console.log('✅ Chargement GitHub réussi:', cars.length, 'voitures');
          return true;
        } else if (response.status === 404) {
          console.warn('⚠️ Fichier data.json inexistant sur GitHub (premier sync)');
          updateSyncStatus('online');
          return true;
        } else {
          console.error('Erreur GitHub:', response.status);
          updateSyncStatus('error');
          return false;
        }
      } catch (err) {
        console.error('❌ Erreur chargement GitHub:', err);
        updateSyncStatus('error');
        return false;
      }
    }

    function updateSyncStatus(status) {
      const el = document.getElementById('sync-status');
      if (status === 'online') {
        el.textContent = '✅ Synchronized';
        el.className = 'sync-status online';
      } else if (status === 'syncing') {
        el.textContent = '⏳ Syncing...';
        el.className = 'sync-status syncing';
      } else if (status === 'offline') {
        el.textContent = '⚙️ Configure GitHub pour synchroniser';
        el.className = 'sync-status';
      } else if (status === 'error') {
        el.textContent = '❌ Erreur sync - vérifiez le token';
        el.className = 'sync-status';
      }
    }

    // ==================== Interface Functions ====================
    function openAddModal() {
      currentImageBase64 = '';
      document.getElementById('car-id').value = '';
      document.getElementById('car-fabricant').value = 'Hot Wheels';
      document.getElementById('car-marque').value = '';
      document.getElementById('car-modele').value = '';
      document.getElementById('car-serie').value = '';
      document.getElementById('car-annee').value = '';
      document.getElementById('car-couleur').value = '';
      document.getElementById('car-ref').value = '';
      document.getElementById('car-etat').value = 'Neuf en boîte';
      document.getElementById('image-preview-container').style.display = 'none';
      document.getElementById('modal-title').textContent = 'Ajouter une voiture';
      document.getElementById('duplicate-warning').style.display = 'none';
      document.getElementById('car-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('car-modal').classList.remove('active');
      currentImageBase64 = '';
    }

    function openLightbox(imageSrc) {
      const body = document.getElementById('lightbox-body');
      body.innerHTML = `<img src="${imageSrc}" class="lightbox-img" alt="Miniature">`;
      document.getElementById('lightbox-modal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    function setView(view) {
      currentView = view;
      document.getElementById('view-card-btn').classList.toggle('active', view === 'cards');
      document.getElementById('view-list-btn').classList.toggle('active', view === 'list');
      filterAndRender();
    }

    function renderBrandTabs() {
      const brands = [...new Set(collection.map(c => c.marque || 'Sans marque'))].sort();
      const container = document.getElementById('brand-tabs');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.textContent = '📍 Toutes';
      allBtn.className = 'tab-btn active';
      allBtn.onclick = () => setCurrentBrand('');
      container.appendChild(allBtn);

      brands.forEach(brand => {
        const btn = document.createElement('button');
        btn.textContent = brand;
        btn.className = 'tab-btn';
        btn.onclick = () => setCurrentBrand(brand);
        container.appendChild(btn);
      });
    }

    function setCurrentBrand(brand) {
      currentBrandFilter = brand;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx === 0 && brand === '') || (btn.textContent === brand));
      });
      filterAndRender();
    }

    function filterAndRender() {
      let filtered = collection;

      if (currentBrandFilter) {
        filtered = filtered.filter(c => c.marque === currentBrandFilter);
      }

      const search = document.getElementById('search-input')?.value.toLowerCase() || '';
      if (search) {
        filtered = filtered.filter(c =>
          (c.marque + ' ' + c.modele + ' ' + c.serie).toLowerCase().includes(search)
        );
      }

      const container = document.getElementById('collection-container');
      if (currentView === 'cards') {
        renderCards(filtered, container);
      } else {
        renderTable(filtered, container);
      }
    }

    function renderCards(cars, container) {
      container.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'collection-grid';

      cars.forEach(car => {
        const card = document.createElement('div');
        card.className = 'car-card';
        card.innerHTML = `
          <div>
            <div class="car-image" onclick="openLightbox('${car.image || ''}')">
              ${car.image ? `<img src="${car.image}" alt="${car.marque}">` : '📷'}
            </div>
            <div class="car-marque-globale">${car.marque}</div>
            <div class="car-details">
              <strong>${car.modele}</strong><br>
              ${car.serie ? `Série: ${car.serie}<br>` : ''}
              Ref: ${car.ref || 'N/A'}<br>
              État: ${car.etat}
            </div>
          </div>
          <div class="car-actions">
            <button onclick="editCar(${car.id})">✏️ Éditer</button>
            <button class="btn-delete" onclick="deleteCar(${car.id})">🗑️</button>
          </div>
        `;
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function renderTable(cars, container) {
      container.innerHTML = '';
      const table = document.createElement('table');
      table.className = 'collection-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th>Photo</th>
            <th>Marque</th>
            <th>Modèle</th>
            <th>Série</th>
            <th>Ref</th>
            <th>État</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${cars.map(car => `
            <tr>
              <td>
                ${car.image ? `<img src="${car.image}" class="table-img" onclick="openLightbox('${car.image}')" alt="${car.marque}">` : '-'}
              </td>
              <td>${car.marque}</td>
              <td>${car.modele}</td>
              <td>${car.serie || '-'}</td>
              <td>${car.ref || '-'}</td>
              <td>${car.etat}</td>
              <td>
                <button onclick="editCar(${car.id})" style="margin-bottom:4px;">✏️</button>
                <button class="btn-delete" onclick="deleteCar(${car.id})">🗑️</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      `;
      container.appendChild(table);
    }

    function updateStats() {
      const total = collection.length;
      const marques = new Set(collection.map(c => c.marque || 'Sans marque')).size;
      const etatCounts = {
        'Neuf en boîte': 0,
        'Loose (Très bon)': 0,
        'Loose (Joué)': 0
      };

      collection.forEach(c => {
        if (etatCounts.hasOwnProperty(c.etat)) etatCounts[c.etat]++;
      });

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-marques').textContent = marques;

      const bar = document.getElementById('dist-bar');
      bar.innerHTML = '';
      const colors = { 'Neuf en boîte': '#10b981', 'Loose (Très bon)': '#f59e0b', 'Loose (Joué)': '#ef4444' };
      const legend = document.getElementById('dist-legend');
      legend.innerHTML = '';

      for (const [etat, color] of Object.entries(colors)) {
        const count = etatCounts[etat];
        const width = (count / total) * 100 || 0;

        const segment = document.createElement('div');
        segment.className = 'progress-segment';
        segment.style.width = width + '%';
        segment.style.backgroundColor = color;
        bar.appendChild(segment);

        const legendItem = document.createElement('div');
        legendItem.className = 'legend-item';
        legendItem.innerHTML = `
          <div class="legend-color" style="background-color:${color}"></div>
          <span>${etat}: ${count}</span>
        `;
        legend.appendChild(legendItem);
      }
    }

    async function editCar(id) {
      const car = collection.find(c => c.id === id);
      if (!car) return;

      document.getElementById('car-id').value = car.id;
      document.getElementById('car-fabricant').value = car.fabricant || 'Hot Wheels';
      document.getElementById('car-marque').value = car.marque || '';
      document.getElementById('car-modele').value = car.modele || '';
      document.getElementById('car-serie').value = car.serie || '';
      document.getElementById('car-annee').value = car.annee || '';
      document.getElementById('car-couleur').value = car.couleur || '';
      document.getElementById('car-ref').value = car.ref || '';
      document.getElementById('car-etat').value = car.etat || 'Neuf en boîte';

      currentImageBase64 = car.image || '';
      const imagePreview = document.getElementById('image-preview');
      const imagePreviewContainer = document.getElementById('image-preview-container');

      if (currentImageBase64) {
        imagePreview.src = currentImageBase64;
        imagePreviewContainer.style.display = 'block';
      } else {
        imagePreviewContainer.style.display = 'none';
      }

      document.getElementById('modal-title').textContent = 'Modifier la voiture';
      checkDuplicates();
      document.getElementById('car-modal').classList.add('active');
    }

    async function deleteCar(id) {
      if (confirm('Supprimer cette voiture ?')) {
        collection = collection.filter(c => c.id !== id);
        await saveCarsToIndexedDB(collection);
        filterAndRender();
        updateStats();
        pushToGitHub();
      }
    }

    function checkDuplicates() {
      const id = document.getElementById('car-id').value;
      const marque = document.getElementById('car-marque').value.trim().toLowerCase();
      const modele = document.getElementById('car-modele').value.trim().toLowerCase();
      const ref = document.getElementById('car-ref').value.trim().toLowerCase();

      const warning = document.getElementById('duplicate-warning');

      if (!marque && !modele && !ref) {
        warning.style.display = 'none';
        return;
      }

      const isDuplicate = collection.some(car => {
        if (id && car.id === parseInt(id)) return false;

        const sameRef = ref && car.ref && car.ref.toLowerCase() === ref;
        const sameModel = marque && modele && car.marque && car.modele &&
          car.marque.toLowerCase() === marque && car.modele.toLowerCase() === modele;

        return sameRef || sameModel;
      });

      warning.style.display = isDuplicate ? 'block' : 'none';
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        currentImageBase64 = evt.target.result;
        document.getElementById('image-preview').src = currentImageBase64;
        document.getElementById('image-preview-container').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function saveCar(e) {
      e.preventDefault();
      const id = document.getElementById('car-id').value;
      const newCar = {
        id: id ? parseInt(id) : Date.now(),
        fabricant: document.getElementById('car-fabricant').value,
        marque: document.getElementById('car-marque').value.trim(),
        modele: document.getElementById('car-modele').value.trim(),
        serie: document.getElementById('car-serie').value.trim(),
        annee: document.getElementById('car-annee').value,
        couleur: document.getElementById('car-couleur').value.trim(),
        ref: document.getElementById('car-ref').value.trim(),
        etat: document.getElementById('car-etat').value,
        image: currentImageBase64
      };

      if (id) {
        const idx = collection.findIndex(c => c.id === parseInt(id));
        if (idx !== -1) collection[idx] = newCar;
      } else {
        collection.push(newCar);
      }

      await saveCarsToIndexedDB(collection);
      filterAndRender();
      updateStats();
      renderBrandTabs();
      closeModal();
      pushToGitHub();
    }

    function exportJSONFile() {
      const blob = new Blob([JSON.stringify(collection, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'collection_miniatures_sauvegarde.json';
      a.click();
    }

    function importJSONFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          collection = JSON.parse(evt.target.result);
          await saveCarsToIndexedDB(collection);
          filterAndRender();
          updateStats();
          renderBrandTabs();
          pushToGitHub();
        } catch (err) {
          alert('Fichier JSON invalide.');
        }
      };
      reader.readAsText(file);
    }

    document.addEventListener('DOMContentLoaded', async function() {
      try {
        // Initialiser IndexedDB
        await initDB();
        
        // Migrer depuis localStorage si nécessaire
        await migrateFromLocalStorage();
        
        // Charger les données depuis IndexedDB
        collection = await getAllCars();

        // Restaurer config GitHub
        const cfg = getGhConfig();
        if (document.getElementById('gh-user')) document.getElementById('gh-user').value = cfg.user;
        if (document.getElementById('gh-repo')) document.getElementById('gh-repo').value = cfg.repo;
        if (document.getElementById('gh-token')) document.getElementById('gh-token').value = cfg.token;

        // Essayer de charger depuis GitHub (attendre la réponse!)
        await loadFromGitHub();
        
        // Afficher les données (locales ou de GitHub)
        renderBrandTabs();
        filterAndRender();
        updateStats();

        // Nettoyage automatique du Service Worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const r of registrations) {
              r.unregister();
            }
          });
        }
      } catch (err) {
        console.error('Erreur initialisation:', err);
        updateSyncStatus('error');
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏎️ Ma Collection de Miniatures</h1>
      <button onclick="openAddModal()">+ Ajouter une voiture</button>
    </header>

    <!-- Configuration GitHub -->
    <div class="config-panel">
      <strong>⚙️ Synchronisation GitHub Sync</strong>
      <div class="config-grid">
        <input type="text" id="gh-user" placeholder="Nom d'utilisateur GitHub">
        <input type="text" id="gh-repo" placeholder="Nom du dépôt (ex: miniatures)">
        <input type="password" id="gh-token" placeholder="Token d'accès (PAT)">
        <button onclick="saveGhConfig()">Enregistrer</button>
      </div>
      <div id="sync-status" class="sync-status">Initialisation...</div>
    </div>

    <!-- Statistiques -->
    <div class="stats-bar">
      <div>
        Total : <strong id="stat-total">0</strong> voitures |
        Marques : <strong id="stat-marques">0</strong>
      </div>
      <div class="progress-bar" id="dist-bar"></div>
      <div class="legend" id="dist-legend"></div>
    </div>

    <!-- Onglets Marques -->
    <div class="tabs" id="brand-tabs"></div>

    <!-- Contrôles -->
    <div class="controls">
      <input type="text" id="search-input" placeholder="Rechercher..." oninput="filterAndRender()" style="width:250px;">
      <div>
        <button id="view-card-btn" class="active" onclick="setView('cards')">🎴 Cartes</button>
        <button id="view-list-btn" onclick="setView('list')">📋 Liste</button>
        <button onclick="exportJSONFile()">💾 Exporter</button>
        <button onclick="document.getElementById('import-file').click()">📂 Importer</button>
        <input type="file" id="import-file" style="display:none" onchange="importJSONFile(event)">
      </div>
    </div>

    <!-- Container de collection -->
    <div id="collection-container"></div>
  </div>

  <!-- Modal Ajout / Édition -->
  <div class="modal" id="car-modal">
    <div class="modal-content">
      <h2 id="modal-title">Ajouter une voiture</h2>
      <form id="car-form" onsubmit="saveCar(event)">
        <input type="hidden" id="car-id">
        <div class="form-group">
          <label>Fabricant :</label>
          <select id="car-fabricant">
            <option value="Hot Wheels">Hot Wheels</option>
            <option value="Matchbox">Matchbox</option>
            <option value="Majorette">Majorette</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Marque :</label>
          <input type="text" id="car-marque" required oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>Modèle :</label>
          <input type="text" id="car-modele" required oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>Série :</label>
          <input type="text" id="car-serie">
        </div>
        <div class="form-group">
          <label>Année :</label>
          <input type="number" id="car-annee">
        </div>
        <div class="form-group">
          <label>Couleur :</label>
          <input type="text" id="car-couleur">
        </div>
        <div class="form-group">
          <label>Référence :</label>
          <input type="text" id="car-ref" oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>État :</label>
          <select id="car-etat">
            <option value="Neuf en boîte">Neuf en boîte</option>
            <option value="Loose (Très bon)">Loose (Très bon)</option>
            <option value="Loose (Joué)">Loose (Joué)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Photo :</label>
          <input type="file" accept="image/*" onchange="handleImageUpload(event)">
          <div id="image-preview-container" style="display:none; margin-top:8px;">
            <img id="image-preview" style="max-width:100%; height:120px; object-fit:contain;">
          </div>
        </div>

        <div id="duplicate-warning" style="display:none; color:#f59e0b; margin-bottom:10px; font-size:0.85rem;">
          ⚠️ Doublon potentiel détecté dans la collection !
        </div>

        <div style="display:flex; gap:8px; margin-top:16px;">
          <button type="submit" style="flex:1;">Enregistrer</button>
          <button type="button" class="btn-delete" onclick="closeModal()" style="flex:1;">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Lightbox (Agrandissement) -->
  <div class="modal" id="lightbox-modal">
    <div class="modal-content" style="text-align:center;">
      <div id="lightbox-body"></div>
      <button onclick="closeLightbox()" style="margin-top:12px; width:100%;">Fermer</button>
    </div>
  </div>
</body>
</html>
