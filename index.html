<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Collection de Miniatures</title>
  <!-- Favicon pour les onglets du navigateur -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">

  <!-- Icône pour l'écran d'accueil mobile (iOS & Android) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .config-panel {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    input, select, button {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button {
      background: var(--accent);
      color: white;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-delete {
      background: #ef4444;
    }

    .sync-status {
      font-size: 0.85rem;
      margin-top: 8px;
      color: var(--text-muted);
    }
    .sync-status.online { color: #10b981; }
    .sync-status.syncing { color: #f59e0b; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .tab-btn.active {
      background: var(--accent);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .car-card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .car-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .car-marque-globale {
      font-weight: bold;
      color: var(--accent);
      margin: 8px 0 4px 0;
    }

    .car-details {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .car-actions {
      display: flex;
      gap: 8px;
    }

    .car-actions button {
      flex: 1;
    }

    .collection-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    .collection-table th, .collection-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .table-img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
    }

    .stats-bar {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .progress-bar {
      display: flex;
      height: 12px;
      background: #090d16;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-segment {
      height: 100%;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 12px;
    }
  </style>
  <script>
    var collection = [];
    try {
      collection = JSON.parse(localStorage.getItem('carCollection')) || [];
    } catch(e) {
      collection = [];
    }

    var selectedBrand = 'Toutes';
    var currentView = 'cards';
    var currentImageBase64 = '';

    var AUTHORIZED_BRANDS = ['Toutes', 'Hot Wheels', 'Matchbox', 'Majorette', 'Autre'];
    var BRAND_COLORS = {
      'Hot Wheels': '#ef4444',
      'Matchbox': '#f59e0b',
      'Majorette': '#10b981',
      'Autre': '#8b5cf6'
    };

    // --- CONFIGURATION GITHUB ---
    function getGhConfig() {
      return {
        user: (localStorage.getItem('gh_user') || '').trim(),
        repo: (localStorage.getItem('gh_repo') || '').trim(),
        token: (localStorage.getItem('gh_token') || '').trim(),
        filePath: 'data.json'
      };
    }

    function saveGhConfig() {
      var userVal = document.getElementById('gh-user').value.trim();
      var repoVal = document.getElementById('gh-repo').value.trim();
      var tokenVal = document.getElementById('gh-token').value.trim();

      localStorage.setItem('gh_user', userVal);
      localStorage.setItem('gh_repo', repoVal);
      localStorage.setItem('gh_token', tokenVal);

      alert('Configuration GitHub enregistrée !');
      loadFromGitHub();
    }

    function updateSyncStatus(text, statusClass) {
      var el = document.getElementById('sync-status');
      if (!el) return;
      el.textContent = text;
      el.className = 'sync-status ' + (statusClass || '');
    }

    // --- LECTURE GITHUB ---
    async function loadFromGitHub() {
      var cfg = getGhConfig();
      if (!cfg.user || !cfg.repo) return;

      updateSyncStatus('⌛ Chargement GitHub...', 'syncing');
      
      var apiUrl = 'https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/' + cfg.filePath + '?ref=main&t=' + Date.now();

      try {
        var headers = {};
        if (cfg.token) {
          headers['Authorization'] = 'token ' + cfg.token;
        }

        var res = await fetch(apiUrl, { headers: headers });
        if (res.ok) {
          var fileData = await res.json();
          
          if (!fileData.content) {
            collection = [];
            updateSyncStatus('⚠️ Fichier data.json vide');
            return;
          }

          var base64Cleaner = fileData.content.replace(/\s/g, '');
          var binaryString = atob(base64Cleaner);
          var bytes = new Uint8Array(binaryString.length);
          for (var i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          var jsonText = new TextDecoder('utf-8').decode(bytes);

          // Sécurité si le fichier JSON est vide ou composé d'espaces
          if (!jsonText || !jsonText.trim()) {
            collection = [];
          } else {
            collection = JSON.parse(jsonText);
          }

          localStorage.setItem('carCollection', JSON.stringify(collection));
          filterAndRender();
          updateStats();
          updateSyncStatus('☁️ Synchronisé avec GitHub', 'online');
        } else {
          updateSyncStatus('⚠️ Erreur chargement GitHub');
        }
      } catch (err) {
        console.error('Erreur lecture GitHub:', err);
        updateSyncStatus('📱 Mode hors-ligne (Local)');
      }
    }

    // --- ÉCRITURE GITHUB ---
    async function pushToGitHub() {
      var cfg = getGhConfig();
      if (!cfg.user || !cfg.repo || !cfg.token) {
        updateSyncStatus('⚠️ GitHub non configuré');
        return;
      }

      updateSyncStatus('⌛ Sauvegarde sur GitHub...', 'syncing');

      var apiUrl = 'https://api.github.com/repos/' + cfg.user + '/' + cfg.repo + '/contents/' + cfg.filePath;
      
      var jsonString = JSON.stringify(collection, null, 2);
      var bytes = new TextEncoder().encode(jsonString);
      var binString = Array.from(bytes, function(byte) { return String.fromCharCode(byte); }).join('');
      var contentBase64 = btoa(binString);

      try {
        var getRes = await fetch(apiUrl, {
          headers: { 'Authorization': 'token ' + cfg.token }
        });
        
        var sha = '';
        if (getRes.ok) {
          var fileInfo = await getRes.json();
          sha = fileInfo.sha;
        }

        var putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + cfg.token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Mise à jour automatique de la collection',
            content: contentBase64,
            sha: sha || undefined
          })
        });

        if (putRes.ok) {
          updateSyncStatus('☁️ Sauvegardé sur GitHub !', 'online');
        } else {
          updateSyncStatus('❌ Erreur de sauvegarde GitHub');
        }
      } catch (err) {
        updateSyncStatus('❌ Erreur réseau GitHub');
      }
    }

    function setView(view) {
      currentView = view;
      var btnCard = document.getElementById('view-card-btn');
      var btnList = document.getElementById('view-list-btn');
      if (btnCard) btnCard.classList.toggle('active', view === 'cards');
      if (btnList) btnList.classList.toggle('active', view === 'list');
      filterAndRender();
    }

    function renderBrandTabs() {
      var container = document.getElementById('brand-tabs');
      if (!container) return;
      container.innerHTML = '';
      AUTHORIZED_BRANDS.forEach(function(brand) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn ' + (brand === selectedBrand ? 'active' : '');
        btn.textContent = brand;
        btn.onclick = function() {
          selectedBrand = brand;
          renderBrandTabs();
          filterAndRender();
        };
        container.appendChild(btn);
      });
    }

    function renderCollection(data) {
      var container = document.getElementById('collection-container');
      if (!container) return;
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; padding: 40px 0;">Aucune voiture trouvée.</p>';
        return;
      }

      if (currentView === 'cards') {
        var grid = document.createElement('div');
        grid.className = 'collection-grid';
        
        data.forEach(function(car) {
          var card = document.createElement('div');
          card.className = 'car-card';
          card.innerHTML = 
            '<div>' +
              '<div class="car-image" onclick="openLightbox(' + car.id + ')">' +
                (car.image ? '<img src="' + car.image + '">' : '<span style="font-size:2rem;">🏎️</span>') +
              '</div>' +
              '<div class="car-marque-globale">' + (car.fabricant || 'Inconnu') + '</div>' +
              '<div class="car-details">' +
                '<div><strong>Marque :</strong> ' + (car.marque || '-') + '</div>' +
                '<div><strong>Modèle :</strong> ' + (car.modele || '-') + '</div>' +
                '<div><strong>Série :</strong> ' + (car.serie || '-') + '</div>' +
                '<div><strong>Année :</strong> ' + (car.annee || '-') + '</div>' +
                '<div><strong>Réf :</strong> ' + (car.ref || '-') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="car-actions">' +
              '<button type="button" onclick="editCar(' + car.id + ')">Éditer</button>' +
              '<button type="button" class="btn-delete" onclick="deleteCar(' + car.id + ')">Supprimer</button>' +
            '</div>';
          grid.appendChild(card);
        });
        container.appendChild(grid);
      } else {
        var table = document.createElement('table');
        table.className = 'collection-table';
        var html = '<thead><tr><th>Photo</th><th>Fabricant</th><th>Marque</th><th>Modèle</th><th>Série</th><th>Année</th><th>Réf</th><th>Actions</th></tr></thead><tbody>';
        
        data.forEach(function(car) {
          html += '<tr>' +
            '<td>' + (car.image ? '<img src="' + car.image + '" class="table-img" onclick="openLightbox(' + car.id + ')">' : '🏎️') + '</td>' +
            '<td><strong style="color:' + (BRAND_COLORS[car.fabricant] || 'white') + '">' + (car.fabricant || '-') + '</strong></td>' +
            '<td>' + (car.marque || '-') + '</td>' +
            '<td>' + (car.modele || '-') + '</td>' +
            '<td>' + (car.serie || '-') + '</td>' +
            '<td>' + (car.annee || '-') + '</td>' +
            '<td>' + (car.ref || '-') + '</td>' +
            '<td>' +
              '<button type="button" onclick="editCar(' + car.id + ')" style="padding:4px 8px; font-size:0.8rem;">✏️</button> ' +
              '<button type="button" class="btn-delete" onclick="deleteCar(' + car.id + ')" style="padding:4px 8px; font-size:0.8rem;">🗑️</button>' +
            '</td>' +
          '</tr>';
        });
        
        html += '</tbody>';
        table.innerHTML = html;
        container.appendChild(table);
      }
    }

    function filterAndRender() {
      var searchInput = document.getElementById('search-input');
      var term = searchInput ? searchInput.value.toLowerCase() : '';

      var filtered = collection.filter(function(car) {
        var matchesBrand = selectedBrand === 'Toutes' || (car.fabricant && car.fabricant.toLowerCase() === selectedBrand.toLowerCase());
        var matchesSearch = (car.marque && car.marque.toLowerCase().indexOf(term) !== -1) ||
                              (car.modele && car.modele.toLowerCase().indexOf(term) !== -1) ||
                              (car.ref && car.ref.toLowerCase().indexOf(term) !== -1);
        return matchesBrand && matchesSearch;
      });

      renderCollection(filtered);
    }

    function updateStats() {
      var statTotal = document.getElementById('stat-total');
      var statMarques = document.getElementById('stat-marques');
      if (statTotal) statTotal.textContent = collection.length;
      
      if (statMarques) {
        var marques = new Set(collection.map(function(c) { return c.marque; }).filter(Boolean));
        statMarques.textContent = marques.size;
      }

      var total = collection.length;
      var counts = {};
      Object.keys(BRAND_COLORS).forEach(function(b) { counts[b] = 0; });

      collection.forEach(function(c) {
        var fab = counts[c.fabricant] !== undefined ? c.fabricant : 'Autre';
        counts[fab] = (counts[fab] || 0) + 1;
      });

      var distBar = document.getElementById('dist-bar');
      var distLegend = document.getElementById('dist-legend');
      if (!distBar || !distLegend) return;
      
      distBar.innerHTML = '';
      distLegend.innerHTML = '';

      if (total === 0) {
        distBar.innerHTML = '<div class="progress-segment" style="width:100%; background:#334155;"></div>';
        return;
      }

      Object.keys(counts).forEach(function(fab) {
        var count = counts[fab];
        if (count > 0) {
          var pct = ((count / total) * 100).toFixed(1);
          
          var seg = document.createElement('div');
          seg.className = 'progress-segment';
          seg.style.width = pct + '%';
          seg.style.backgroundColor = BRAND_COLORS[fab] || '#94a3b8';
          seg.title = fab + ': ' + pct + '%';
          distBar.appendChild(seg);

          var leg = document.createElement('div');
          leg.className = 'legend-item';
          leg.innerHTML = '<div class="legend-color" style="background-color: ' + (BRAND_COLORS[fab] || '#94a3b8') + '"></div>' +
            '<span>' + fab + ': <strong>' + pct + '%</strong> (' + count + ')</span>';
          distLegend.appendChild(leg);
        }
      });
    }

    function openAddModal() {
      var form = document.getElementById('car-form');
      if (form) form.reset();
      currentImageBase64 = '';
      document.getElementById('image-preview-container').style.display = 'none';
      document.getElementById('car-id').value = '';
      document.getElementById('duplicate-warning').style.display = 'none';
      document.getElementById('modal-title').textContent = 'Ajouter une voiture';
      document.getElementById('car-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('car-modal').classList.remove('active');
    }

    function openLightbox(id) {
      var car = collection.find(function(c) { return c.id === id; });
      if (!car) return;

      var body = document.getElementById('lightbox-body');
      body.innerHTML = 
        '<h2 style="margin-top:0;">' + (car.marque || '') + ' ' + (car.modele || 'Miniature') + '</h2>' +
        (car.image ? '<img src="' + car.image + '" class="lightbox-img">' : '<div style="font-size:4rem; margin:20px;">🏎️</div>') +
        '<div style="text-align:left; background:#090d16; padding:15px; border-radius:8px; font-size:0.95rem;">' +
          '<p><strong>Fabricant :</strong> ' + (car.fabricant || '-') + '</p>' +
          '<p><strong>Marque :</strong> ' + (car.marque || '-') + '</p>' +
          '<p><strong>Modèle :</strong> ' + (car.modele || '-') + '</p>' +
          '<p><strong>Série :</strong> ' + (car.serie || '-') + '</p>' +
          '<p><strong>Année :</strong> ' + (car.annee || '-') + '</p>' +
          '<p><strong>Couleur :</strong> ' + (car.couleur || '-') + '</p>' +
          '<p><strong>Référence :</strong> ' + (car.ref || '-') + '</p>' +
          '<p><strong>État :</strong> ' + (car.etat || '-') + '</p>' +
        '</div>';
      document.getElementById('lightbox-modal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    function editCar(id) {
      var car = collection.find(function(c) { return c.id === id; });
      if (!car) return;

      document.getElementById('car-id').value = car.id;
      document.getElementById('car-fabricant').value = car.fabricant || 'Hot Wheels';
      document.getElementById('car-marque').value = car.marque || '';
      document.getElementById('car-modele').value = car.modele || '';
      document.getElementById('car-serie').value = car.serie || '';
      document.getElementById('car-annee').value = car.annee || '';
      document.getElementById('car-couleur').value = car.couleur || '';
      document.getElementById('car-ref').value = car.ref || '';
      document.getElementById('car-etat').value = car.etat || 'Neuf en boîte';

      currentImageBase64 = car.image || '';
      var imagePreview = document.getElementById('image-preview');
      var imagePreviewContainer = document.getElementById('image-preview-container');

      if (currentImageBase64) {
        imagePreview.src = currentImageBase64;
        imagePreviewContainer.style.display = 'block';
      } else {
        imagePreviewContainer.style.display = 'none';
      }

      document.getElementById('modal-title').textContent = 'Modifier la voiture';
      checkDuplicates();
      document.getElementById('car-modal').classList.add('active');
    }

    function deleteCar(id) {
      if (confirm('Supprimer cette voiture ?')) {
        collection = collection.filter(function(c) { return c.id !== id; });
        localStorage.setItem('carCollection', JSON.stringify(collection));
        filterAndRender();
        updateStats();
        pushToGitHub();
      }
    }

    function checkDuplicates() {
      var id = document.getElementById('car-id').value;
      var marque = document.getElementById('car-marque').value.trim().toLowerCase();
      var modele = document.getElementById('car-modele').value.trim().toLowerCase();
      var ref = document.getElementById('car-ref').value.trim().toLowerCase();

      var warning = document.getElementById('duplicate-warning');

      if (!marque && !modele && !ref) {
        warning.style.display = 'none';
        return;
      }

      var isDuplicate = collection.some(function(car) {
        if (id && car.id === parseInt(id)) return false;

        var sameRef = ref && car.ref && car.ref.toLowerCase() === ref;
        var sameModel = marque && modele && car.marque && car.modele && car.marque.toLowerCase() === marque && car.modele.toLowerCase() === modele;

        return sameRef || sameModel;
      });

      warning.style.display = isDuplicate ? 'block' : 'none';
    }

    function handleImageUpload(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        currentImageBase64 = evt.target.result;
        document.getElementById('image-preview').src = currentImageBase64;
        document.getElementById('image-preview-container').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function saveCar(e) {
      e.preventDefault();
      var id = document.getElementById('car-id').value;
      var newCar = {
        id: id ? parseInt(id) : Date.now(),
        fabricant: document.getElementById('car-fabricant').value,
        marque: document.getElementById('car-marque').value.trim(),
        modele: document.getElementById('car-modele').value.trim(),
        serie: document.getElementById('car-serie').value.trim(),
        annee: document.getElementById('car-annee').value,
        couleur: document.getElementById('car-couleur').value.trim(),
        ref: document.getElementById('car-ref').value.trim(),
        etat: document.getElementById('car-etat').value,
        image: currentImageBase64
      };

      if (id) {
        var idx = collection.findIndex(function(c) { return c.id === parseInt(id); });
        if (idx !== -1) collection[idx] = newCar;
      } else {
        collection.push(newCar);
      }

      localStorage.setItem('carCollection', JSON.stringify(collection));

      filterAndRender();
      updateStats();
      closeModal();
      pushToGitHub();
    }

    function exportJSONFile() {
      var blob = new Blob([JSON.stringify(collection, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'collection_miniatures_sauvegarde.json';
      a.click();
    }

    function importJSONFile(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        try {
          collection = JSON.parse(evt.target.result);
          localStorage.setItem('carCollection', JSON.stringify(collection));
          filterAndRender();
          updateStats();
          pushToGitHub();
        } catch (err) {
          alert('Fichier JSON invalide.');
        }
      };
      reader.readAsText(file);
    }

    document.addEventListener('DOMContentLoaded', function() {
      var cfg = getGhConfig();
      if (document.getElementById('gh-user')) document.getElementById('gh-user').value = cfg.user;
      if (document.getElementById('gh-repo')) document.getElementById('gh-repo').value = cfg.repo;
      if (document.getElementById('gh-token')) document.getElementById('gh-token').value = cfg.token;

      renderBrandTabs();
      filterAndRender();
      updateStats();
      
      loadFromGitHub();

      // Nettoyage automatique du Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        });
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏎️ Ma Collection de Miniatures</h1>
      <button onclick="openAddModal()">+ Ajouter une voiture</button>
    </header>

    <!-- Configuration GitHub -->
    <div class="config-panel">
      <strong>⚙️ Synchronisation GitHub Sync</strong>
      <div class="config-grid">
        <input type="text" id="gh-user" placeholder="Nom d'utilisateur GitHub">
        <input type="text" id="gh-repo" placeholder="Nom du dépôt (ex: miniatures)">
        <input type="password" id="gh-token" placeholder="Token d'accès (PAT)">
        <button onclick="saveGhConfig()">Enregistrer</button>
      </div>
      <div id="sync-status" class="sync-status">Hors-ligne</div>
    </div>

    <!-- Statistiques -->
    <div class="stats-bar">
      <div>
        Total : <strong id="stat-total">0</strong> voitures |
        Marques : <strong id="stat-marques">0</strong>
      </div>
      <div class="progress-bar" id="dist-bar"></div>
      <div class="legend" id="dist-legend"></div>
    </div>

    <!-- Onglets Marques -->
    <div class="tabs" id="brand-tabs"></div>

    <!-- Contrôles -->
    <div class="controls">
      <input type="text" id="search-input" placeholder="Rechercher..." oninput="filterAndRender()" style="width:250px;">
      <div>
        <button id="view-card-btn" class="active" onclick="setView('cards')">🎴 Cartes</button>
        <button id="view-list-btn" onclick="setView('list')">📋 Liste</button>
        <button onclick="exportJSONFile()">💾 Exporter</button>
        <button onclick="document.getElementById('import-file').click()">📂 Importer</button>
        <input type="file" id="import-file" style="display:none" onchange="importJSONFile(event)">
      </div>
    </div>

    <!-- Container de collection -->
    <div id="collection-container"></div>
  </div>

  <!-- Modal Ajout / Édition -->
  <div class="modal" id="car-modal">
    <div class="modal-content">
      <h2 id="modal-title">Ajouter une voiture</h2>
      <form id="car-form" onsubmit="saveCar(event)">
        <input type="hidden" id="car-id">
        <div class="form-group">
          <label>Fabricant :</label>
          <select id="car-fabricant">
            <option value="Hot Wheels">Hot Wheels</option>
            <option value="Matchbox">Matchbox</option>
            <option value="Majorette">Majorette</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Marque :</label>
          <input type="text" id="car-marque" required oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>Modèle :</label>
          <input type="text" id="car-modele" required oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>Série :</label>
          <input type="text" id="car-serie">
        </div>
        <div class="form-group">
          <label>Année :</label>
          <input type="number" id="car-annee">
        </div>
        <div class="form-group">
          <label>Couleur :</label>
          <input type="text" id="car-couleur">
        </div>
        <div class="form-group">
          <label>Référence :</label>
          <input type="text" id="car-ref" oninput="checkDuplicates()">
        </div>
        <div class="form-group">
          <label>État :</label>
          <select id="car-etat">
            <option value="Neuf en boîte">Neuf en boîte</option>
            <option value="Loose (Très bon)">Loose (Très bon)</option>
            <option value="Loose (Joué)">Loose (Joué)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Photo :</label>
          <input type="file" accept="image/*" onchange="handleImageUpload(event)">
          <div id="image-preview-container" style="display:none; margin-top:8px;">
            <img id="image-preview" style="max-width:100%; height:120px; object-fit:contain;">
          </div>
        </div>

        <div id="duplicate-warning" style="display:none; color:#f59e0b; margin-bottom:10px; font-size:0.85rem;">
          ⚠️ Doublon potentiel détecté dans la collection !
        </div>

        <div style="display:flex; gap:8px; margin-top:16px;">
          <button type="submit" style="flex:1;">Enregistrer</button>
          <button type="button" class="btn-delete" onclick="closeModal()" style="flex:1;">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Lightbox (Agrandissement) -->
  <div class="modal" id="lightbox-modal">
    <div class="modal-content" style="text-align:center;">
      <div id="lightbox-body"></div>
      <button onclick="closeLightbox()" style="margin-top:12px; width:100%;">Fermer</button>
    </div>
  </div>
</body>
</html>
